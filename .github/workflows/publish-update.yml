name: Publish app update metadata
on:
  push:
    branches: [main]
    paths:
      - scripts/make_release_feed.py
      - .github/workflows/publish-update.yml
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (example v1.2.3)'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: stable-update-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (!github.event.release.prerelease && !github.event.release.draft)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select existing public release and download APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          fi
          echo "SELECTED_RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          mkdir -p release-files
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,name,body,isDraft,isPrerelease,assets > release.json
          python3 -c 'import json; r=json.load(open("release.json")); assert not r["isDraft"] and not r["isPrerelease"], "Only public stable-channel releases are accepted"'
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir release-files
      - name: Locate Android build tools
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          AAPT_PATH=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          test -n "$AAPT_PATH"
          echo "AAPT_PATH=$AAPT_PATH" >> "$GITHUB_ENV"
          echo "SIGNER_PATH=$(dirname "$AAPT_PATH")/apksigner" >> "$GITHUB_ENV"
      - name: Verify APK and generate update manifest
        run: python3 scripts/make_release_feed.py --release release.json --directory release-files --aapt "$AAPT_PATH" --apksigner "$SIGNER_PATH" --output latest.json
      - name: Upload update manifest after APK verification
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$SELECTED_RELEASE_TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$SELECTED_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --latest
